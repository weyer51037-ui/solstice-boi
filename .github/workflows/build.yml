name: Solstice Client Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Solstice Client Mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Find mod folder
        id: find
        run: echo "dir=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -n1)")" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Solstice-Client-Mod
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
